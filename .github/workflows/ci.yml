name: CI & Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEON_AUTH_SECRET: ci-test-secret-32-chars-long-minimum!
      NEON_AUTH_COOKIE_SECRET: ci-test-cookie-secret-32-chars-minimum!
      NEON_AUTH_BASE_URL: https://ep-shiny-mouse-b3r8ssd8.neonauth.c-4.ap-southeast-1.aws.neon.tech/neondb/auth
      NEXT_PUBLIC_APP_URL: https://checkmargin.netlify.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Run ESLint Code Quality Verification
        run: npm run lint

      - name: Run CheckMargin Financial & Production Calculation Engine Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
